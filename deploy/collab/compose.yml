name: pydicate-studio
services:
  postgres:
    image: postgres:17-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: studio_owner
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_admin_password
    secrets: [postgres_admin_password, postgres_password]
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres-init.sh:/docker-entrypoint-initdb.d/10-studio.sh:ro
    networks: [database]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -h 127.0.0.1 -U studio_app -d studio_prod']
      interval: 5s
      timeout: 5s
      retries: 20
    # No host port: laptop access is through SSH and docker compose exec.
  studio:
    build:
      context: ../..
      dockerfile: deploy/collab/Dockerfile
    image: pydicate-studio:${APP_RELEASE:-local}
    restart: unless-stopped
    init: true
    stop_grace_period: 75s
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 2g
    cpus: 2.0
    env_file: ${COLLAB_ENV_FILE:-.env}
    environment:
      APP_RELEASE: ${APP_RELEASE:-development}
      COLLAB_STATE_DIR: /data
      COLLAB_HOST: 0.0.0.0
      COLLAB_PORT: 8787
      COLLAB_TRUST_PROXY: '1'
      COLLAB_AI_ENABLED: '0'
      COLLAB_VAULT_KEY_FILE: /run/secrets/provider_vault_key
      PGHOST: postgres
      PGUSER: studio_app
      PGDATABASE: studio_prod
      PGPASSWORD_FILE: /run/secrets/postgres_password
      PYDICATE_PROJECT_PARENT: /workspace
    depends_on:
      postgres:
        condition: service_healthy
    secrets: [postgres_password, provider_vault_key, neo_identity_secret]
    volumes:
      - ${COLLAB_DATA_DIR:?Set COLLAB_DATA_DIR}:/data
      - ${COLLAB_WORKSPACE:?Set COLLAB_WORKSPACE}/oldtupicorpus:/workspace/oldtupicorpus
      - ${COLLAB_WORKSPACE:?Set COLLAB_WORKSPACE}/nhe-enga:/workspace/nhe-enga:ro
    tmpfs:
      - /tmp:size=256m,mode=1777
    networks:
      edge:
        aliases: [pydicate-studio]
      database:
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:8787/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
volumes:
  postgres_data:
secrets:
  postgres_password:
    file: ${COLLAB_ROOT:?Set COLLAB_ROOT}/config/postgres-password
  postgres_admin_password:
    file: ${COLLAB_ROOT:?Set COLLAB_ROOT}/config/postgres-admin-password
  provider_vault_key:
    file: ${COLLAB_ROOT:?Set COLLAB_ROOT}/config/provider-vault-key
  neo_identity_secret:
    file: ${COLLAB_ROOT:?Set COLLAB_ROOT}/config/neo-identity-secret
networks:
  edge:
    external: true
    name: ${COLLAB_EDGE_NETWORK:-caddy_edge}
  database:
    internal: true
