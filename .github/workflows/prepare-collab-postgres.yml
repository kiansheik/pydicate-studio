name: Prepare tested collaboration changes
on:
  push:
    branches: [collab-server-kian]
    paths: ['.github/workflows/prepare-collab-postgres.yml']
permissions:
  contents: write
jobs:
  prepare:
    if: github.repository == 'kiansheik/pydicate-studio' && github.actor == 'kiansheik'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Apply checksum-verified source changes only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64,hashlib,json,lzma,subprocess
          blobs='''dfabeff5154d2b1704d85624bce66f0671ed83ae
          c5ca98ad4b54faf66cacda5b7558763237f0ca86
          80e107dcad3c239b8c6e55598c72542ecb02975d
          47d5972f2c51cbf7b0d9d85a3eaf65ac17905d64
          057075dde7b8a2f4ef71fb384a4b0aa4f27e6614
          b175a40dbcd2a5c6a43ff90a904a073b1b796d0f
          6e09a991286be3637f8b5ee3f4fe9290862fa8c7
          92bd2fd527dcba5cd16909775319651e41be49eb
          3cf65779e0148a938f066fc9c7db0e140325bb04
          6c17e1259e20ba6c6d9724f964ff415639d02f49
          7d9953920ff8cd5fa6a30ef1f92c6624394a3b99
          ce6f14c5e6899bea9567f92e1804bfa66d2b685e
          3dddd263a2a898a7e9c983b02cfe7107802fcfa6
          9116aee05bedda53d06b5646bc6f39a117541a9c
          ac8315415cacaf8a1afc698b05289734f8df4df5
          c08750a82a7533ab459da91dd07a453685480fb3
          50910106b2bec736935b9eb7886097b5981af8c8
          2eecf26cbd602cbb5e5815f3d62d731dac91f941
          e39bd782f1f95872e526f36632e0e64d583aad7f
          17553f290e45a5c83552c2f47236045527556d7f
          297790339c6e2411f4384b35df9c657b1c96b420
          43965e1be2de98035cae5473a4e4892f8abbd2c8
          95a75726f6038ae3519764194db79c81b44e77f8
          a3b7adef5345881a38876e836de5fbe867044dec
          cbd30610f3af26eb448e7a7a9c3c522b4473faa6
          070711318e1c2c971946d3d7d8ce29f2974765a3
          34058e8c782e92588d56558335d5c08b219e4d0d'''.split()
          chunks=[]
          for sha in blobs:
              result=json.loads(subprocess.check_output(['gh','api',f'repos/kiansheik/pydicate-studio/git/blobs/{sha}']))
              chunk=base64.b64decode(result['content'])
              assert hashlib.sha1(b'blob '+str(len(chunk)).encode()+b'\0'+chunk).hexdigest()==sha
              chunks.append(chunk)
          patch=lzma.decompress(base64.b64decode(b''.join(chunks)))
          assert hashlib.sha256(patch).hexdigest()=='e0061ac6d74215eea873613d620e2d80d6c38c829cf037cd87ab56a06f2d1717'
          assert b'diff --git a/.github/workflows/' not in patch
          subprocess.run(['git','apply','--index','--whitespace=nowarn','-'],input=patch,check=True)
          PY
          git -c user.name='Studio maintenance' -c user.email='studio@academiatupi.com' commit -m 'Persist research in PostgreSQL, add reproducible deployment and invited Neo identity'
          git push origin HEAD:refs/heads/collab-server-kian
