name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: npm ci
      - name: Build and focused checks
        # Installers ship the checked-in reference library. Regenerating it is a
        # separate authoring task requiring the contributor's selected corpus.
        run: npm run format:check && npm run build:app && npm test && npm run test:desktop && npm run test:python
      - name: Install the browser used by Playwright
        run: npx playwright install --with-deps chrome
      - name: Browser workflows
        run: npm run test:e2e
      - name: Preserve failed browser evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
